# Netlify build config for the web admin panel (React + Vite).
# It's a monorepo, so `base` points Netlify at the web/ folder; leave the
# "Base directory" field empty in the Netlify UI so this file drives it.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

# SPA fallback: react-router uses client-side routes (/agenda, /reserva/:slug,
# ...). Without this, refreshing or opening a deep link returns 404. The
# _redirects file in web/public does the same; this is a belt-and-suspenders.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
